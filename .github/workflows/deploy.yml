name: Deploy game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test puzzle rules
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
